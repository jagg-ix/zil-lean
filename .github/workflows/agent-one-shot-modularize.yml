name: One-shot engine modularization

on:
  push:
    branches:
      - agent/complete-engine-governance-modules
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  modularize-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/complete-engine-governance-modules
          fetch-depth: 0

      - name: Convert remaining engine and governance files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          targets = [
              "Zil/Core/Declaration.lean",
              "Zil/Core/DeclarationSet.lean",
              "Zil/Core/Program.lean",
              "Zil/Engine/Provenance.lean",
              "Zil/Impact.lean",
              "Zil/Parser/Tuple.lean",
              "Zil/ProofObligation.lean",
              "Zil/TheoremAudit.lean",
              "Zil/QueryGovernance.lean",
          ]

          for filename in targets:
              path = Path(filename)
              lines = path.read_text(encoding="utf-8").splitlines()
              if lines and lines[0] == "module":
                  continue
              import_end = 0
              while import_end < len(lines) and lines[import_end].startswith("import "):
                  import_end += 1
              if import_end == 0:
                  raise SystemExit(f"{filename}: expected leading imports")
              public_imports = [
                  line.replace("import ", "public import ", 1)
                  for line in lines[:import_end]
              ]
              converted = [
                  "module",
                  "",
                  *public_imports,
                  "",
                  "@[expose] public section",
                  "",
                  *lines[import_end:],
              ]
              path.write_text("\n".join(converted).rstrip() + "\n", encoding="utf-8")
          PY

      - name: Install Lean toolchain
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build converted modules
        shell: bash
        run: |
          lake build Zil.Core.Declaration
          lake build Zil.Core.DeclarationSet
          lake build Zil.Core.Program
          lake build Zil.Engine.Provenance
          lake build Zil.Impact
          lake build Zil.Parser.Tuple
          lake build Zil.ProofObligation
          lake build Zil.TheoremAudit
          lake build Zil.QueryGovernance

      - name: Verify module import surface
        shell: bash
        run: |
          cat > EngineProbe.lean <<'EOF'
          module
          public import Zil.Engine.Provenance
          public import Zil.Impact
          public import Zil.ProofObligation
          public import Zil.TheoremAudit
          public import Zil.QueryGovernance
          EOF
          lake env lean EngineProbe.lean
          rm -f EngineProbe.lean

      - name: Build complete package
        shell: bash
        run: lake build

      - name: Commit validated conversion
        shell: bash
        run: |
          rm -f .github/workflows/agent-one-shot-modularize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Zil/Core/Declaration.lean \
            Zil/Core/DeclarationSet.lean \
            Zil/Core/Program.lean \
            Zil/Engine/Provenance.lean \
            Zil/Impact.lean \
            Zil/Parser/Tuple.lean \
            Zil/ProofObligation.lean \
            Zil/TheoremAudit.lean \
            Zil/QueryGovernance.lean \
            .github/workflows/agent-one-shot-modularize.yml
          git diff --cached --check
          git commit -m "Complete engine and governance modularization"
          git push origin HEAD:agent/complete-engine-governance-modules
