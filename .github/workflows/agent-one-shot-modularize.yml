name: Publish validated engine modularization

on:
  push:
    branches:
      - agent/complete-engine-governance-modules
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  publish-validated-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/complete-engine-governance-modules
          fetch-depth: 0

      - name: Reproduce validated conversion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = [
              "Zil/Core/Declaration.lean",
              "Zil/Core/DeclarationSet.lean",
              "Zil/Core/Program.lean",
              "Zil/Engine/Provenance.lean",
              "Zil/Impact.lean",
              "Zil/Parser/Tuple.lean",
              "Zil/ProofObligation.lean",
              "Zil/TheoremAudit.lean",
              "Zil/QueryGovernance.lean",
          ]

          module_closure = [
              "Zil/Core/Term.lean",
              "Zil/Core/Attribute.lean",
              "Zil/Core/Relation.lean",
              "Zil/Core/Rule.lean",
              "Zil/Core/Macro.lean",
              "Zil/Core/Declaration.lean",
              "Zil/Core/DeclarationSet.lean",
              "Zil/Core/Program.lean",
              "Zil/Core/Query.lean",
              "Zil/Core/Userset.lean",
              "Zil/Codec/Attribute.lean",
              "Zil/Codec/Canonical.lean",
              "Zil/Environment/Knowledge.lean",
              "Zil/Profile/Core.lean",
              "Zil/Engine/Query.lean",
              "Zil/Engine/Provenance.lean",
              "Zil/Impact.lean",
              "Zil/Parser/Tuple.lean",
              "Zil/ProofObligation.lean",
              "Zil/TheoremAudit.lean",
              "Zil/QueryGovernance.lean",
          ]

          for filename in targets:
              path = Path(filename)
              lines = path.read_text(encoding="utf-8").splitlines()
              if not (lines and lines[0] == "module"):
                  import_end = 0
                  while import_end < len(lines) and lines[import_end].startswith("import "):
                      import_end += 1
                  public_imports = [line.replace("import ", "public import ", 1) for line in lines[:import_end]]
                  lines = ["module", "", *public_imports, "", "@[expose] public section", "", *lines[import_end:]]
                  path.write_text("\n".join(lines).rstrip() + "\n", encoding="utf-8")

          canonical = Path("Zil/Codec/Canonical.lean")
          canonical_text = canonical.read_text(encoding="utf-8")
          if "private def nameFromString" in canonical_text:
              canonical_text = re.sub(r"\bnameFromString\b", "canonicalNameFromString", canonical_text)
              canonical.write_text(canonical_text, encoding="utf-8")

          for filename in module_closure:
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              text = re.sub(r"(?m)^(\s*)private\s+", r"\1", text)
              path.write_text(text.rstrip() + "\n", encoding="utf-8")
          PY

      - name: Commit and push validated source
        shell: bash
        run: |
          set +e
          {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Zil
            git status --short
            git diff --cached --check
            git commit -m "Complete engine and governance modularization"
            git push origin HEAD:agent/complete-engine-governance-modules
          } > commit.log 2>&1
          status=$?
          cat commit.log
          exit "$status"

      - name: Upload publication diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: modularization-commit-log
          path: commit.log
          if-no-files-found: error
