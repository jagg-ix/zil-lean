name: One-shot engine modularization

on:
  push:
    branches:
      - agent/complete-engine-governance-modules
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  modularize-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/complete-engine-governance-modules
          fetch-depth: 0

      - name: Convert and expose module dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = [
              "Zil/Core/Declaration.lean",
              "Zil/Core/DeclarationSet.lean",
              "Zil/Core/Program.lean",
              "Zil/Engine/Provenance.lean",
              "Zil/Impact.lean",
              "Zil/Parser/Tuple.lean",
              "Zil/ProofObligation.lean",
              "Zil/TheoremAudit.lean",
              "Zil/QueryGovernance.lean",
          ]

          module_closure = [
              "Zil/Core/Term.lean",
              "Zil/Core/Attribute.lean",
              "Zil/Core/Relation.lean",
              "Zil/Core/Rule.lean",
              "Zil/Core/Macro.lean",
              "Zil/Core/Declaration.lean",
              "Zil/Core/DeclarationSet.lean",
              "Zil/Core/Program.lean",
              "Zil/Core/Query.lean",
              "Zil/Core/Userset.lean",
              "Zil/Codec/Attribute.lean",
              "Zil/Codec/Canonical.lean",
              "Zil/Environment/Knowledge.lean",
              "Zil/Profile/Core.lean",
              "Zil/Engine/Query.lean",
              "Zil/Engine/Provenance.lean",
              "Zil/Impact.lean",
              "Zil/Parser/Tuple.lean",
              "Zil/ProofObligation.lean",
              "Zil/TheoremAudit.lean",
              "Zil/QueryGovernance.lean",
          ]

          for filename in targets:
              path = Path(filename)
              lines = path.read_text(encoding="utf-8").splitlines()
              if not (lines and lines[0] == "module"):
                  import_end = 0
                  while import_end < len(lines) and lines[import_end].startswith("import "):
                      import_end += 1
                  if import_end == 0:
                      raise SystemExit(f"{filename}: expected leading imports")
                  public_imports = [
                      line.replace("import ", "public import ", 1)
                      for line in lines[:import_end]
                  ]
                  lines = [
                      "module",
                      "",
                      *public_imports,
                      "",
                      "@[expose] public section",
                      "",
                      *lines[import_end:],
                  ]
                  path.write_text("\n".join(lines).rstrip() + "\n", encoding="utf-8")

          canonical = Path("Zil/Codec/Canonical.lean")
          canonical_text = canonical.read_text(encoding="utf-8")
          if "private def nameFromString" in canonical_text:
              canonical_text = re.sub(r"\bnameFromString\b", "canonicalNameFromString", canonical_text)
              canonical.write_text(canonical_text, encoding="utf-8")

          for filename in module_closure:
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              text = re.sub(r"(?m)^(\s*)private\s+", r"\1", text)
              path.write_text(text.rstrip() + "\n", encoding="utf-8")
          PY

      - name: Install Lean toolchain
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build converted modules
        shell: bash
        run: |
          set +e
          : > build.log
          for target in \
            Zil.Core.Declaration \
            Zil.Core.DeclarationSet \
            Zil.Core.Program \
            Zil.Engine.Provenance \
            Zil.Impact \
            Zil.Parser.Tuple \
            Zil.ProofObligation \
            Zil.TheoremAudit \
            Zil.QueryGovernance
          do
            echo "=== lake build $target ===" | tee -a build.log
            lake build "$target" >> build.log 2>&1
            status=$?
            if [ "$status" -ne 0 ]; then
              tail -120 build.log
              exit "$status"
            fi
          done

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: modularization-build-log
          path: build.log
          if-no-files-found: error

      - name: Verify module import surface
        shell: bash
        run: |
          cat > EngineProbe.lean <<'EOF'
          module
          public import Zil.Engine.Provenance
          public import Zil.Impact
          public import Zil.ProofObligation
          public import Zil.TheoremAudit
          public import Zil.QueryGovernance
          EOF
          lake env lean EngineProbe.lean
          rm -f EngineProbe.lean

      - name: Build complete package
        shell: bash
        run: lake build

      - name: Commit validated source conversion
        shell: bash
        run: |
          rm -f build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Zil/Core/Term.lean \
            Zil/Core/Attribute.lean \
            Zil/Core/Relation.lean \
            Zil/Core/Rule.lean \
            Zil/Core/Macro.lean \
            Zil/Core/Declaration.lean \
            Zil/Core/DeclarationSet.lean \
            Zil/Core/Program.lean \
            Zil/Core/Query.lean \
            Zil/Core/Userset.lean \
            Zil/Codec/Attribute.lean \
            Zil/Codec/Canonical.lean \
            Zil/Environment/Knowledge.lean \
            Zil/Profile/Core.lean \
            Zil/Engine/Query.lean \
            Zil/Engine/Provenance.lean \
            Zil/Impact.lean \
            Zil/Parser/Tuple.lean \
            Zil/ProofObligation.lean \
            Zil/TheoremAudit.lean \
            Zil/QueryGovernance.lean
          git diff --cached --check
          git commit -m "Complete engine and governance modularization"
          git push origin HEAD:agent/complete-engine-governance-modules
